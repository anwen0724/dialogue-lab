[project]
name = "dialogue-lab"
version = "0.1.0"
description = "Dialogue Lab backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "anyio>=4.15.1",
    "asyncpg>=0.30,<1",
    "dialogue-ai[anthropic,openai]",
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "speechio>=0.2.0,<0.3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialogue_lab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
dialogue-ai = { path = "packages/ai", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17.2",
]
