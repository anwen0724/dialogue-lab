[project]
name = "dialogue-lab"
version = "0.1.0"
description = "Dialogue Lab backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dialogue-ai",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialogue_lab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
dialogue-ai = { path = "../packages/ai", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
