[project]
name = "dialogue-ai"
version = "0.1.0"
description = "Independent asynchronous model invocation layer"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
openai = ["openai>=2.54,<3"]
anthropic = ["anthropic>=0.125,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: explicitly enabled real provider calls"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
